name: wessless
description: "WessLess — AI-Powered Production Forecasting to Reduce Food Waste in Culinary MSMEs"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  intl: ^0.20.2
  percent_indicator: ^4.2.3
  flutter_animate: ^4.5.2
  image_picker: ^1.2.2
  http: ^1.2.1
  url_launcher: ^6.2.5
  webview_flutter: ^4.10.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
